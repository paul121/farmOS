workspaceLocation: "."
tasks:
  - name: Prepare docker development.
    init: |
      # Build the development docker image with the gitpod user id.
      docker build --build-arg WWW_DATA_ID="$(id -u)" /workspace/farmOS/docker/dev -t farmos/farmos:2.x-dev

      # Create docker-compose.yml.
      cp /workspace/farmOS/.gitpod/docker-compose.yml /workspace && docker-compose up -d

      # Replace farmOS repo.
      rm -r /workspace/www/web/profiles/farm && mv /workspace/farmOS /workspace/www/web/profiles/farm

      # Reinstall composer.
      rm /workspace/www/web/composer.lock && docker-compose exec -u www-data www composer install

ports:
  - port: 8080
